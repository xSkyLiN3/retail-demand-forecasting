limit_req_zone $binary_remote_addr zone=retail_page:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=retail_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=retail_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name retail.nightstrike.cloud;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://retail.nightstrike.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name retail.nightstrike.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/retail.nightstrike.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.nightstrike.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/retail.nightstrike.cloud.access.log;
    error_log /var/log/nginx/retail.nightstrike.cloud.error.log;

    client_max_body_size 1k;
    client_body_timeout 5s;
    send_timeout 15s;
    keepalive_timeout 20s;
    limit_conn retail_conn 8;
    limit_conn_status 429;
    limit_req_status 429;

    gzip on;
    gzip_min_length 1k;
    gzip_types application/json application/javascript text/css text/plain;

    proxy_hide_header Server;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /api/ {
        limit_except GET { deny all; }
        limit_req zone=retail_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / {
        limit_except GET { deny all; }
        limit_req zone=retail_page burst=20 nodelay;

        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
