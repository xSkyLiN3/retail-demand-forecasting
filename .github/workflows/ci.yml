name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py312.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --constraint requirements/constraints-py312.txt --editable ".[api,postgres,dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Build distribution
        run: python -m build

  container-smoke:
    name: Container smoke (PostgreSQL + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: retail-forecasting-ci
      POSTGRES_PASSWORD: ci-only-retail-forecasting
      PORT: "18080"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Verify PostgreSQL-backed API and evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          base = "http://127.0.0.1:18080"

          def load(path):
              with urlopen(base + path, timeout=10) as response:
                  assert response.status == 200
                  return json.load(response)

          assert load("/health") == {
              "status": "ok",
              "backend": "postgresql",
              "schema_version": 1,
          }

          forecasts = load("/api/forecasts?limit=5000")
          monitoring = load("/api/monitoring?limit=5000")
          assert forecasts["count"] == len(forecasts["items"]) == 1680
          assert monitoring["count"] == len(monitoring["items"]) == 1680

          with urlopen(base + "/", timeout=10) as response:
              dashboard = response.read().decode("utf-8")
          assert "/api/forecasts" in dashboard
          assert "/api/monitoring" in dashboard
          PY

      - name: Verify idempotent PostgreSQL seeding
        shell: bash
        run: |
          docker compose restart api
          docker compose up --detach --wait --wait-timeout 180

          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          base = "http://127.0.0.1:18080"

          def count(path):
              with urlopen(base + path, timeout=10) as response:
                  return json.load(response)["count"]

          assert count("/api/forecasts?limit=5000") == 1680
          assert count("/api/monitoring?limit=5000") == 1680
          PY

      - name: Show container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true

      - name: Tear down the ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans
