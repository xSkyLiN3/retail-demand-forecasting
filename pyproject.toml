[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "1.0.0"
description = "Leakage-aware retail demand forecasting with rolling-origin backtesting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cristóbal Vergara" }]
keywords = ["forecasting", "machine-learning", "retail", "time-series", "ml-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.136,<0.137",
    "uvicorn>=0.49,<0.50",
]
postgres = [
    "psycopg[binary]>=3.3,<4",
]
dev = [
    "build>=1.2,<2",
    "httpx>=0.28,<0.29",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
retail-forecast = "retail_forecasting.cli:main"
retail-forecast-api = "retail_forecasting.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
