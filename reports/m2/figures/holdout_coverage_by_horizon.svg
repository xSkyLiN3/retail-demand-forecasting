<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Final holdout interval coverage by forecast horizon</title>
  <desc id="desc">Coverage is below the 85 percent minimum at horizons 3, 4, 5, 6, 11, 12 and 13; it is above the 98 percent maximum at horizons 1, 8 and 9.</desc>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="64" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14213d">Final holdout coverage by horizon</text>
  <text x="64" y="58" font-family="Arial, sans-serif" font-size="13" fill="#586579">Nominal 90% · accepted guardrail 85–98% · 120 rows per horizon</text>
  <g stroke="#dce3eb" stroke-width="1">
    <line x1="64" y1="350" x2="924" y2="350"/>
    <line x1="64" y1="285" x2="924" y2="285"/>
    <line x1="64" y1="220" x2="924" y2="220"/>
    <line x1="64" y1="155" x2="924" y2="155"/>
    <line x1="64" y1="90" x2="924" y2="90"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#6b778c" text-anchor="end">
    <text x="56" y="354">0%</text><text x="56" y="289">25%</text><text x="56" y="224">50%</text><text x="56" y="159">75%</text><text x="56" y="94">100%</text>
  </g>
  <rect x="64" y="95.2" width="860" height="33.8" fill="#2fbf9f" opacity="0.10"/>
  <line x1="64" y1="129" x2="924" y2="129" stroke="#d1495b" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="64" y1="116" x2="924" y2="116" stroke="#3273dc" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-family="Arial, sans-serif" font-size="10" fill="#586579">
    <text x="788" y="125">minimum 85%</text><text x="838" y="112">nominal 90%</text>
  </g>
  <g>
    <rect x="82" y="90" width="36" height="260" rx="4" fill="#e5a93d"/><rect x="142" y="96.5" width="36" height="253.5" rx="4" fill="#2f9e84"/>
    <rect x="202" y="142" width="36" height="208" rx="4" fill="#d1495b"/><rect x="262" y="317.5" width="36" height="32.5" rx="4" fill="#d1495b"/>
    <rect x="322" y="168" width="36" height="182" rx="4" fill="#d1495b"/><rect x="382" y="131.2" width="36" height="218.8" rx="4" fill="#d1495b"/>
    <rect x="442" y="111.7" width="36" height="238.3" rx="4" fill="#2f9e84"/><rect x="502" y="90" width="36" height="260" rx="4" fill="#e5a93d"/>
    <rect x="562" y="92.2" width="36" height="257.8" rx="4" fill="#e5a93d"/><rect x="622" y="129" width="36" height="221" rx="4" fill="#2f9e84"/>
    <rect x="682" y="319.7" width="36" height="30.3" rx="4" fill="#d1495b"/><rect x="742" y="150.7" width="36" height="199.3" rx="4" fill="#d1495b"/>
    <rect x="802" y="135.5" width="36" height="214.5" rx="4" fill="#d1495b"/><rect x="862" y="122.5" width="36" height="227.5" rx="4" fill="#2f9e84"/>
  </g>
