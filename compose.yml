services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: retail_forecasting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecast_demo}
      POSTGRES_USER: retail_forecasting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_forecasting -d retail_forecasting"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - retail_forecasting_postgres:/var/lib/postgresql

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://retail_forecasting:${POSTGRES_PASSWORD:-forecast_demo}@postgres:5432/retail_forecasting
      DEMO_SNAPSHOT_PATH: /app/demo/demo_snapshot.json
      HOST: 0.0.0.0
      PORT: 8000
      SEED_DEMO: "1"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  retail_forecasting_postgres:
